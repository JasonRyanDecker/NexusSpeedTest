<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap');
        
        :root {
            --cyber-cyan: #00f0ff;
            --cyber-magenta: #ff00ff;
            --cyber-purple: #8b5cf6;
            --cyber-blue: #3b82f6;
            --cyber-pink: #ec4899;
            --neon-green: #00ff9f;
            --dark-bg: #0a0a0f;
            --card-bg: rgba(15, 15, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-dim: #64748b;
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.5);
            --glow-magenta: 0 0 20px rgba(255, 0, 255, 0.5);
            --success: #00ff9f;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated background gradient mesh */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 0, 255, 0.1) 0%, transparent 50%);
            animation: gradientShift 15s ease infinite;
            pointer-events: none;
        }
        
        @keyframes gradientShift {
            0%, 100% { opacity: 1; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.8; transform: scale(1.1) rotate(5deg); }
        }
        
        /* Grid overlay */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.5;
            pointer-events: none;
        }
        
        .app {
            width: 100%;
            max-width: 720px;
            position: relative;
            z-index: 1;
        }
        
        /* Top metric strip */
        .metrics {
            display: flex;
            justify-content: center;
            gap: 48px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }
        
        .metric {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 12px 20px;
            transition: all 0.3s;
        }
        
        .metric:hover {
            border-color: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
        }
        
        .metric-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--cyber-cyan);
        }
        
        .metric-icon.jitter-icon {
            background: rgba(168, 85, 247, 0.1);
            border-color: rgba(168, 85, 247, 0.2);
            color: var(--cyber-purple);
        }
        
        .metric-icon svg {
            width: 16px;
            height: 16px;
        }
        
        .metric-content {
            display: flex;
            flex-direction: column;
        }
        
        .metric-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            font-weight: 300;
            margin-bottom: 2px;
        }
        
        .metric-value {
            font-family: 'Orbitron', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1;
            color: var(--text-primary);
        }
        
        .metric-unit {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 300;
            margin-left: 3px;
        }
        
        /* Gauge wrapper */
        .gauge-wrap {
            position: relative;
            width: 100%;
            max-width: 520px;
            margin: 0 auto 24px;
            aspect-ratio: 2 / 1.3;
        }
        
        .gauge-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }
        
        /* Center display */
        .gauge-display {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 100%;
        }
        
        .speed-value {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, var(--cyber-cyan), var(--cyber-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }
        
        .speed-unit {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 8px;
            letter-spacing: 4px;
            font-weight: 400;
            text-transform: uppercase;
        }
        
        .test-phase {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--cyber-cyan);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        
        .test-phase.active {
            opacity: 1;
        }
        
        /* Action button */
        .action-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .start-btn {
            background: linear-gradient(135deg, var(--cyber-cyan), var(--cyber-purple));
            border: none;
            padding: 18px 56px;
            border-radius: 100px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 8px 32px rgba(0, 240, 255, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .start-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .start-btn:hover::before {
            width: 400px;
            height: 400px;
        }
        
        .start-btn span {
            position: relative;
            z-index: 1;
        }
        
        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 240, 255, 0.5);
        }
        
        .start-btn:active {
            transform: translateY(-1px);
        }
        
        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Result cards */
        .results {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 16px;
        }
        
        .result-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        
        .result-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            opacity: 0.6;
        }
        
        .result-card.download::before {
            background: linear-gradient(90deg, transparent, var(--cyber-cyan), transparent);
        }
        
        .result-card.upload::before {
            background: linear-gradient(90deg, transparent, var(--cyber-magenta), transparent);
        }
        
        .result-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .result-card.download:hover {
            box-shadow: 0 8px 30px rgba(0, 240, 255, 0.2);
        }
        
        .result-card.upload:hover {
            box-shadow: 0 8px 30px rgba(255, 0, 255, 0.2);
        }
        
        .result-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }
        
        .result-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        .result-dot.download {
            background: var(--cyber-cyan);
            box-shadow: 0 0 12px var(--cyber-cyan);
        }
        
        .result-dot.upload {
            background: var(--cyber-magenta);
            box-shadow: 0 0 12px var(--cyber-magenta);
        }
        
        .result-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            font-weight: 400;
        }
        
        .result-value {
            font-family: 'Orbitron', monospace;
            font-size: 2.25rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 4px;
        }
        
        .result-value.download {
            background: linear-gradient(135deg, var(--cyber-cyan), var(--cyber-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .result-value.upload {
            background: linear-gradient(135deg, var(--cyber-magenta), var(--cyber-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .result-unit {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 1px;
        }
        
        /* Quality indicator */
        .quality-row {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            opacity: 0;
            transition: opacity 0.5s;
            gap: 16px;
        }
        
        .quality-row.visible {
            opacity: 1;
        }
        
        .quality-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }
        
        .quality-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            font-weight: 400;
        }
        
        .quality-text {
            font-size: 0.95rem;
            color: var(--text-primary);
            font-weight: 500;
        }
        
        .quality-badge {
            padding: 8px 20px;
            border-radius: 100px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
        }
        
        .quality-badge.excellent {
            background: rgba(0, 255, 159, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
            box-shadow: 0 0 20px rgba(0, 255, 159, 0.2);
        }
        .quality-badge.good {
            background: rgba(0, 240, 255, 0.1);
            color: var(--cyber-cyan);
            border: 1px solid var(--cyber-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
        }
        .quality-badge.fair {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid var(--warning);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }
        .quality-badge.poor {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
        }
        
        /* Footer info */
        .footer-info {
            display: flex;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .footer-item {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        
        .footer-item-label {
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
        }
        
        .footer-item-value {
            color: var(--text-primary);
            font-weight: 600;
            font-family: 'Orbitron', monospace;
            font-size: 0.85rem;
        }
        
        /* Responsive */
        @media (max-width: 640px) {
            body {
                padding: 24px 16px;
            }
            
            .metrics {
                gap: 12px;
                margin-bottom: 24px;
            }
            
            .metric {
                padding: 10px 16px;
            }
            
            .metric-value {
                font-size: 0.95rem;
            }
            
            .speed-value {
                font-size: 2.25rem;
            }
            
            .results {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            
            .result-value {
                font-size: 2rem;
            }
            
            .footer-info {
                flex-direction: column;
                gap: 8px;
                padding: 14px 18px;
            }
            
            .start-btn {
                padding: 14px 40px;
                font-size: 0.8rem;
                letter-spacing: 2px;
            }
            
            .quality-row {
                flex-direction: column;
                align-items: flex-start;
            }
        }
        
        @media (max-width: 380px) {
            .metric-icon {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="grid-overlay"></div>
    
    <div class="app">
        <!-- Top metrics strip -->
        <div class="metrics">
            <div class="metric">
                <div class="metric-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2"/>
                        <circle cx="12" cy="12" r="9" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="metric-content">
                    <div class="metric-label">Ping</div>
                    <div class="metric-value"><span id="pingVal">—</span><span class="metric-unit">ms</span></div>
                </div>
            </div>
            
            <div class="metric">
                <div class="metric-icon jitter-icon">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12h4l3-9 4 18 3-9h4"/>
                    </svg>
                </div>
                <div class="metric-content">
                    <div class="metric-label">Jitter</div>
                    <div class="metric-value"><span id="jitterVal">—</span><span class="metric-unit">ms</span></div>
                </div>
            </div>
        </div>
        
        <!-- Half-circle gauge -->
        <div class="gauge-wrap">
            <div class="test-phase" id="testPhase">Ready</div>
            
            <svg class="gauge-svg" viewBox="0 0 400 240">
                <defs>
                    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00f0ff"/>
                        <stop offset="50%" stop-color="#8b5cf6"/>
                        <stop offset="100%" stop-color="#ff00ff"/>
                    </linearGradient>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                
                <!-- Background arc -->
                <path d="M 40 200 A 160 160 0 0 1 360 200"
                      fill="none"
                      stroke="rgba(255,255,255,0.06)"
                      stroke-width="20"
                      stroke-linecap="round"/>
                
                <!-- Progress arc -->
                <path id="progressArc"
                      d="M 40 200 A 160 160 0 0 1 360 200"
                      fill="none"
                      stroke="url(#gaugeGrad)"
                      stroke-width="20"
                      stroke-linecap="round"
                      stroke-dasharray="503"
                      stroke-dashoffset="503"
                      filter="url(#glow)"/>
                
                <!-- Tick marks -->
                <g id="ticks"></g>
                
                <!-- Scale labels -->
                <g id="labels" font-family="Orbitron, monospace" font-size="13" fill="#a0a0b0" font-weight="700"></g>
                
                <!-- Needle -->
                <g id="needle" transform="rotate(-90 200 200)" style="transform-origin: 200px 200px;">
                    <line x1="200" y1="200" x2="200" y2="55" stroke="#00f0ff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
                    <circle cx="200" cy="200" r="10" fill="#00f0ff" filter="url(#glow)"/>
                    <circle cx="200" cy="200" r="5" fill="#0a0a0f"/>
                </g>
            </svg>
            
            <div class="gauge-display">
                <div class="speed-value" id="speedValue">0.00</div>
                <div class="speed-unit">Mbps</div>
            </div>
        </div>
        
        <!-- Action button -->
        <div class="action-section">
            <button class="start-btn" id="startBtn">
                <span id="btnText">Start Test</span>
            </button>
        </div>
        
        <!-- Results -->
        <div class="results">
            <div class="result-card download">
                <div class="result-header">
                    <div class="result-dot download"></div>
                    <div class="result-label">Download</div>
                </div>
                <div class="result-value download" id="downloadResult">0.00</div>
                <div class="result-unit">Mbps</div>
            </div>
            
            <div class="result-card upload">
                <div class="result-header">
                    <div class="result-dot upload"></div>
                    <div class="result-label">Upload</div>
                </div>
                <div class="result-value upload" id="uploadResult">0.00</div>
                <div class="result-unit">Mbps</div>
            </div>
        </div>
        
        <!-- Quality -->
        <div class="quality-row" id="qualityRow">
            <div class="quality-info">
                <div class="quality-label">Connection Quality</div>
                <div class="quality-text" id="qualityText">Run test to analyze connection</div>
            </div>
            <div class="quality-badge excellent" id="qualityBadge">—</div>
        </div>
        
        <!-- Footer info -->
        <div class="footer-info">
            <div class="footer-item">
                <span class="footer-item-label">Server:</span>
                <span class="footer-item-value">CDN Optimized</span>
            </div>
            <div class="footer-item">
                <span class="footer-item-label">Connection:</span>
                <span class="footer-item-value" id="connType">—</span>
            </div>
            <div class="footer-item">
                <span class="footer-item-label">Last test:</span>
                <span class="footer-item-value" id="lastTest">Never</span>
            </div>
        </div>
    </div>
    
    <script>
        // Linear scale - evenly spaced 250 Mbps tiers (0, 250, 500, 750, 1000)
        const MAX_SPEED = 1000;
        const SCALE_TIERS = [0, 250, 500, 750, 1000];
        
        // Convert speed to gauge percentage (linear, 0-100)
        function speedToPercent(speed) {
            if (speed <= 0) return 0;
            if (speed >= MAX_SPEED) return 100;
            return (speed / MAX_SPEED) * 100;
        }
        
        // Convert percentage to angle (-90 to 90 degrees, half circle from left to right)
        function percentToAngle(pct) {
            return -90 + (pct / 100) * 180;
        }
        
        // Generate tick marks and labels - evenly spaced
        function generateGaugeMarks() {
            const ticksGroup = document.getElementById('ticks');
            const labelsGroup = document.getElementById('labels');
            
            // Generate minor ticks at every 5% (20 ticks total)
            for (let i = 0; i <= 20; i++) {
                const pct = i * 5;
                const angle = (-180 + (pct / 100) * 180) * (Math.PI / 180);
                
                const isMajor = pct % 25 === 0; // major tick at every 250 Mbps (25%)
                const innerR = isMajor ? 142 : 148;
                const outerR = isMajor ? 158 : 154;
                
                const x1 = 200 + innerR * Math.cos(angle);
                const y1 = 200 + innerR * Math.sin(angle);
                const x2 = 200 + outerR * Math.cos(angle);
                const y2 = 200 + outerR * Math.sin(angle);
                
                const tick = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                tick.setAttribute('x1', x1);
                tick.setAttribute('y1', y1);
                tick.setAttribute('x2', x2);
                tick.setAttribute('y2', y2);
                tick.setAttribute('stroke', isMajor ? 'rgba(0, 240, 255, 0.6)' : 'rgba(255,255,255,0.2)');
                tick.setAttribute('stroke-width', isMajor ? '2.5' : '1.5');
                tick.setAttribute('stroke-linecap', 'round');
                ticksGroup.appendChild(tick);
            }
            
            // Generate major labels at evenly spaced tiers
            SCALE_TIERS.forEach((speed, idx) => {
                const pct = (speed / MAX_SPEED) * 100;
                const angle = (-180 + (pct / 100) * 180) * (Math.PI / 180);
                
                const labelRadius = 122;
                const lx = 200 + labelRadius * Math.cos(angle);
                const ly = 200 + labelRadius * Math.sin(angle);
                
                const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                label.setAttribute('x', lx);
                label.setAttribute('y', ly);
                label.setAttribute('text-anchor', 'middle');
                label.setAttribute('dominant-baseline', 'middle');
                label.setAttribute('fill', '#a0a0b0');
                label.textContent = speed;
                labelsGroup.appendChild(label);
            });
        }
        
        // Update gauge with current speed
        function updateGauge(speed, animated = true) {
            const arc = document.getElementById('progressArc');
            const needle = document.getElementById('needle');
            const speedDisplay = document.getElementById('speedValue');
            
            const pct = speedToPercent(speed);
            const angle = percentToAngle(pct);
            
            const arcLength = 503;
            const offset = arcLength - (pct / 100) * arcLength;
            
            if (animated) {
                gsap.to(arc, {
                    strokeDashoffset: offset,
                    duration: 0.4,
                    ease: "power2.out"
                });
                
                gsap.to(needle, {
                    rotation: angle,
                    duration: 0.5,
                    ease: "power2.out",
                    transformOrigin: "200px 200px"
                });
                
                const current = parseFloat(speedDisplay.textContent) || 0;
                gsap.to({ v: current }, {
                    v: speed,
                    duration: 0.4,
                    ease: "power2.out",
                    onUpdate: function() {
                        speedDisplay.textContent = this.targets()[0].v.toFixed(2);
                    }
                });
            } else {
                arc.style.strokeDashoffset = offset;
                needle.setAttribute('transform', `rotate(${angle} 200 200)`);
                speedDisplay.textContent = speed.toFixed(2);
            }
        }
        
        function animateValue(el, end, duration = 600) {
            const start = parseFloat(el.textContent) || 0;
            gsap.to({ v: start }, {
                v: end,
                duration: duration / 1000,
                ease: "power2.out",
                onUpdate: function() {
                    el.textContent = this.targets()[0].v.toFixed(1);
                }
            });
        }
        
        function setPhase(text, show = true) {
            const phase = document.getElementById('testPhase');
            phase.textContent = text;
            if (show) {
                phase.classList.add('active');
            } else {
                phase.classList.remove('active');
            }
        }
        
        // Speed Test Engine
        class SpeedTest {
            constructor() {
                this.results = { download: 0, upload: 0, ping: 0, jitter: 0 };
                
                // CORS-friendly endpoints
                this.pingEndpoints = [
                    'https://speed.cloudflare.com/__down?bytes=1',
                    'https://httpbin.org/get',
                    'https://www.google.com/generate_204'
                ];
                
                this.downloadEndpoints = [
                    'https://speed.cloudflare.com/__down?bytes=100000000',
                    'https://proof.ovh.net/files/100Mb.dat'
                ];
                
                this.uploadEndpoint = 'https://speed.cloudflare.com/__up';
            }
            
            getConnectionType() {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                return conn ? (conn.effectiveType || 'Unknown').toUpperCase() : 'Unknown';
            }
            
            async testPing() {
                const samples = [];
                let endpoint = null;
                
                // Find a working endpoint
                for (const url of this.pingEndpoints) {
                    try {
                        const testStart = performance.now();
                        await fetch(url, {
                            method: 'GET',
                            cache: 'no-cache',
                            mode: 'cors'
                        });
                        endpoint = url;
                        samples.push(performance.now() - testStart);
                        break;
                    } catch (e) {
                        // Try next endpoint
                        continue;
                    }
                }
                
                if (!endpoint) {
                    console.warn('No ping endpoint available');
                    return { avg: 0, jitter: 0 };
                }
                
                // Run remaining ping samples
                for (let i = 0; i < 4; i++) {
                    const start = performance.now();
                    try {
                        await fetch(endpoint, {
                            method: 'GET',
                            cache: 'no-cache',
                            mode: 'cors'
                        });
                        samples.push(performance.now() - start);
                    } catch (e) {}
                    await new Promise(r => setTimeout(r, 100));
                }
                
                if (samples.length === 0) return { avg: 0, jitter: 0 };
                
                const avg = samples.reduce((a, b) => a + b) / samples.length;
                const variance = samples.reduce((s, v) => s + Math.pow(v - avg, 2), 0) / samples.length;
                return { avg, jitter: Math.sqrt(variance) };
            }
            
            async testDownload(onProgress) {
                const duration = 10000;
                const speeds = [];
                
                for (const endpoint of this.downloadEndpoints) {
                    try {
                        const start = performance.now();
                        const response = await fetch(endpoint, {
                            cache: 'no-cache',
                            mode: 'cors'
                        });
                        
                        if (!response.ok) continue;
                        
                        const reader = response.body.getReader();
                        let lastTime = start;
                        let bytes = 0;
                        
                        while (true) {
                            const now = performance.now();
                            const { done, value } = await reader.read();
                            if (done || (now - start) >= duration) break;
                            
                            bytes += value.length;
                            
                            if (now - lastTime >= 200) {
                                const mbps = (bytes * 8 / ((now - lastTime) / 1000)) / (1024 * 1024);
                                speeds.push(mbps);
                                if (onProgress) onProgress(mbps);
                                bytes = 0;
                                lastTime = now;
                            }
                        }
                        
                        reader.cancel();
                        const valid = speeds.slice(1);
                        return valid.length > 0 ? valid.reduce((a, b) => a + b) / valid.length : 0;
                    } catch (e) {
                        console.warn('Download endpoint failed, trying next:', endpoint);
                        continue;
                    }
                }
                
                console.error('All download endpoints failed');
                return 0;
            }
            
            async testUpload(onProgress) {
                const duration = 10000;
                const size = 25 * 1024 * 1024; // 25MB
                const data = new Blob([new ArrayBuffer(size)]);
                const start = performance.now();
                
                const interval = setInterval(() => {
                    const elapsed = performance.now() - start;
                    if (elapsed < duration && elapsed > 500) {
                        const sentBytes = size * Math.min(elapsed / duration, 1);
                        const mbps = (sentBytes * 8 / (elapsed / 1000)) / (1024 * 1024);
                        if (onProgress) onProgress(mbps);
                    }
                }, 200);
                
                try {
                    await Promise.race([
                        fetch(this.uploadEndpoint, {
                            method: 'POST',
                            body: data,
                            cache: 'no-cache',
                            mode: 'cors'
                        }),
                        new Promise(r => setTimeout(r, duration))
                    ]);
                    clearInterval(interval);
                    const elapsed = Math.min(performance.now() - start, duration);
                    return (size * 8 / (elapsed / 1000)) / (1024 * 1024);
                } catch (e) {
                    clearInterval(interval);
                    console.warn('Upload test failed:', e);
                    return 0;
                }
            }
            
            getQuality() {
                const { download, ping } = this.results;
                if (download >= 100 && ping < 30) return { rating: 'excellent', text: 'Perfect for 4K streaming and competitive gaming' };
                if (download >= 50 && ping < 50) return { rating: 'good', text: 'Great for HD streaming and video calls' };
                if (download >= 25 && ping < 100) return { rating: 'fair', text: 'Suitable for browsing and SD streaming' };
                if (download > 0) return { rating: 'poor', text: 'Limited performance for streaming and downloads' };
                return { rating: 'poor', text: 'Test failed — try running from a hosted server (not file://)' };
            }
        }
        
        // App Controller
        class App {
            constructor() {
                this.test = new SpeedTest();
                this.running = false;
                this.init();
            }
            
            init() {
                generateGaugeMarks();
                
                document.getElementById('startBtn').addEventListener('click', () => this.run());
                document.getElementById('connType').textContent = this.test.getConnectionType();
                
                updateGauge(0, false);
                
                gsap.from('.metrics', { opacity: 0, y: -20, duration: 0.6, ease: "power2.out" });
                gsap.from('.gauge-wrap', { opacity: 0, scale: 0.95, duration: 0.8, delay: 0.1, ease: "power2.out" });
                gsap.from('.action-section', { opacity: 0, y: 20, duration: 0.5, delay: 0.3 });
                gsap.from('.result-card', { opacity: 0, y: 20, duration: 0.5, delay: 0.4, stagger: 0.1 });
                gsap.from('.quality-row', { opacity: 0, y: 20, duration: 0.5, delay: 0.6 });
                gsap.from('.footer-info', { opacity: 0, y: 20, duration: 0.5, delay: 0.7 });
            }
            
            async run() {
                if (this.running) return;
                this.running = true;
                
                const btn = document.getElementById('startBtn');
                const btnText = document.getElementById('btnText');
                btn.disabled = true;
                btnText.textContent = 'Testing...';
                
                updateGauge(0, false);
                document.getElementById('downloadResult').textContent = '0.00';
                document.getElementById('uploadResult').textContent = '0.00';
                document.getElementById('qualityRow').classList.remove('visible');
                
                try {
                    setPhase('Measuring Latency');
                    const ping = await this.test.testPing();
                    this.test.results.ping = ping.avg;
                    this.test.results.jitter = ping.jitter;
                    animateValue(document.getElementById('pingVal'), ping.avg);
                    animateValue(document.getElementById('jitterVal'), ping.jitter);
                    
                    setPhase('Download');
                    const download = await this.test.testDownload(speed => {
                        updateGauge(speed);
                    });
                    this.test.results.download = download;
                    updateGauge(download);
                    animateValue(document.getElementById('downloadResult'), download, 800);
                    
                    await new Promise(r => setTimeout(r, 800));
                    
                    setPhase('Upload');
                    updateGauge(0);
                    await new Promise(r => setTimeout(r, 400));
                    
                    const upload = await this.test.testUpload(speed => {
                        updateGauge(speed);
                    });
                    this.test.results.upload = upload;
                    updateGauge(upload);
                    animateValue(document.getElementById('uploadResult'), upload, 800);
                    
                    setPhase('Complete');
                    setTimeout(() => setPhase('', false), 2000);
                    
                    const quality = this.test.getQuality();
                    const badge = document.getElementById('qualityBadge');
                    const text = document.getElementById('qualityText');
                    badge.textContent = quality.rating.charAt(0).toUpperCase() + quality.rating.slice(1);
                    badge.className = 'quality-badge ' + quality.rating;
                    text.textContent = quality.text;
                    document.getElementById('qualityRow').classList.add('visible');
                    
                    document.getElementById('lastTest').textContent = new Date().toLocaleTimeString();
                } catch (e) {
                    console.error(e);
                    setPhase('Error');
                } finally {
                    this.running = false;
                    btn.disabled = false;
                    btnText.textContent = 'Run Again';
                }
            }
        }
        
        new App();
    </script>
</body>
